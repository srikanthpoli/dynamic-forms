name: Deploy Frontend

on:
  push:
    branches: [master]
    paths: ["frontend/**"]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
  STACK_NAME: DynamicFormsStack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cd dist/dynamic-forms-frontend/browser
          zip -qr "$RUNNER_TEMP/ui.zip" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "BUCKET=$(out ArtifactsBucket)" >> "$GITHUB_ENV"
          echo "INSTANCE_ID=$(out InstanceId)" >> "$GITHUB_ENV"

      - name: Upload build
        run: aws s3 cp "$RUNNER_TEMP/ui.zip" "s3://$BUCKET/frontend/ui.zip"

      - name: Publish on instance
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          aws s3 cp s3://$BUCKET/frontend/ui.zip /tmp/ui.zip --region $AWS_REGION
          rm -rf /tmp/ui-new && mkdir /tmp/ui-new
          unzip -q /tmp/ui.zip -d /tmp/ui-new
          rm -rf /var/www/dynamic-forms/*
          cp -r /tmp/ui-new/* /var/www/dynamic-forms/
          nginx -t
          systemctl reload nginx
          curl -fsS http://127.0.0.1/ > /dev/null
          EOF
          )
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > "$RUNNER_TEMP/params.json"
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --query Command.CommandId --output text)
          status=0
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || status=$?
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output yaml
          exit $status
