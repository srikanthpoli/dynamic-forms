name: Refresh AWS Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What should be refreshed on the existing EC2 deployment?"
        required: true
        default: both
        type: choice
        options:
          - backend
          - frontend
          - both

concurrency:
  group: refresh-aws-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh existing EC2 deployment
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      EC2_USER: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
      EC2_PORT: ${{ secrets.AWS_EC2_PORT || '22' }}
      SSH_KEY_PATH: /tmp/dynamic_forms_aws_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "${{ secrets.AWS_EC2_SSH_KEY }}"
          printf '%s\n' "${{ secrets.AWS_EC2_SSH_KEY }}" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          mkdir -p ~/.ssh
          if ! timeout 15 bash -c "</dev/tcp/$EC2_HOST/$EC2_PORT"; then
            echo "Could not reach $EC2_HOST:$EC2_PORT from the GitHub runner."
            echo "Check the EC2 security group inbound SSH rule. GitHub-hosted runners are not your laptop IP."
            exit 1
          fi
          ssh-keyscan -T 15 -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Refresh backend on EC2
        if: ${{ github.event.inputs.target == 'backend' || github.event.inputs.target == 'both' }}
        run: |
          set -euo pipefail
          ssh -T -i "$SSH_KEY_PATH" -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail
            cd ~/dynamic-forms
            git fetch origin master
            git checkout master
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "EC2 checkout has uncommitted tracked changes. Commit, stash, or revert them before deployment."
              git status --short
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/master; then
              backup_branch="deploy-backup-$(date +%Y%m%d%H%M%S)"
              git branch "$backup_branch" HEAD
              echo "EC2 checkout had local commits. Saved current HEAD to $backup_branch before syncing to origin/master."
            fi
            git reset --hard origin/master

            cd ~/dynamic-forms/backend
            source "$HOME/.local/bin/env"
            source .venv/bin/activate
            uv sync

            sudo systemctl restart dynamic-forms-api
            sudo systemctl is-active --quiet dynamic-forms-api
            healthy=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
                echo "Backend health check passed."
                healthy=true
                break
              fi
              echo "Waiting for backend health check... attempt $attempt/20"
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              echo "Backend did not become healthy after restart. Recent logs:"
              sudo journalctl -u dynamic-forms-api -n 100 --no-pager
              exit 1
            fi
          EOF

      - name: Set up Node.js
        if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cd dist/dynamic-forms-frontend/browser
          zip -r "$RUNNER_TEMP/dynamic-forms-ui.zip" .

      - name: Upload frontend build to EC2
        if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
        run: |
          set -euo pipefail
          scp -i "$SSH_KEY_PATH" -P "$EC2_PORT" "$RUNNER_TEMP/dynamic-forms-ui.zip" "$EC2_USER@$EC2_HOST:/tmp/dynamic-forms-ui.zip"

      - name: Publish frontend on EC2
        if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
        run: |
          set -euo pipefail
          ssh -T -i "$SSH_KEY_PATH" -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail
            rm -rf /tmp/dynamic-forms-ui-new
            mkdir -p /tmp/dynamic-forms-ui-new
            unzip -q /tmp/dynamic-forms-ui.zip -d /tmp/dynamic-forms-ui-new

            sudo mkdir -p /var/www/dynamic-forms
            sudo rm -rf /var/www/dynamic-forms/*
            sudo cp -r /tmp/dynamic-forms-ui-new/* /var/www/dynamic-forms/

            sudo nginx -t
            sudo systemctl restart nginx
            curl --fail http://127.0.0.1/
          EOF
