name: Deploy Infrastructure

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [master]
    paths: ["infra/**"]
  workflow_dispatch:

concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}

jobs:
  cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synth
        run: cdk synth

      - name: Diff
        if: github.event_name == 'pull_request'
        run: cdk diff

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Show outputs
        if: github.event_name != 'pull_request'
        run: cat cdk-outputs.json
