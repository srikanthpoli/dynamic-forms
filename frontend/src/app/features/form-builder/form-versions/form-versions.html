<section class="versions-panel">
  <div class="section-heading"><div class="eyebrow">Version history</div><h2>Draft &amp; published versions</h2></div>
  @if (versions.length) {
    <div class="versions-list">
      @for (version of versions; track version.id) {
        <button class="version-row" [class.selected]="selectedVersionId === version.id" type="button" (click)="versionSelected.emit(version)">
          <span class="version-number">v{{ version.version_number }}</span>
          <span class="version-status" [class.published]="version.status === 'published'">{{ version.status }}</span>
          <span class="version-fields">{{ version.layout_tree.length }} field{{ version.layout_tree.length === 1 ? '' : 's' }}</span>
        </button>
      }
    </div>
  } @else {
    <p class="empty">Save a draft version to see it listed here.</p>
  }
</section>
