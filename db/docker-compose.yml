services:
  dynamicforms-db:
    build: .
    container_name: dynamicForms
    environment:
      POSTGRES_DB: dynamic_forms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data/pgdata:/var/lib/postgresql/data

  dynamicforms-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dynamicFormsPgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dynamicforms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - dynamicforms-db
